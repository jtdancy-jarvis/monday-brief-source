name: Monday feed watchdog

# The publish workflow can only report failures of runs that started. If the
# Sunday producer never writes a script, never pushes, or pushes something the
# path filter misses, no run starts and nothing complains. This closes that
# gap: every Monday at 10:30 UTC (6:30am ET), check that the live feed's
# newest episode is dated today, and open an issue if it is not.
#
# No secrets needed -- the feed is public, and GITHUB_TOKEN can file issues.

on:
  schedule:
    - cron: '30 10 * * 1'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Newest episode should be dated today
        id: check
        run: |
          python3 - <<'PY'
          import datetime as dt
          import email.utils
          import sys
          import urllib.request
          import xml.etree.ElementTree as ET

          FEED = "https://jtdancy-jarvis.github.io/monday-brief/feed.xml"
          today = dt.datetime.now(dt.timezone.utc).date()

          try:
              with urllib.request.urlopen(FEED, timeout=60) as r:
                  xml = r.read()
          except Exception as e:
              print(f"::error::could not fetch {FEED}: {e}")
              sys.exit(1)

          # Parse the feed rather than pattern-matching enclosure URLs. The URL
          # used to embed the date ("episodes/YYYY-MM-DD.mp3"), so a regex
          # worked -- until audio moved to Releases, whose URLs look like
          # "releases/download/ep-DATE/DATE.mp3" and contain no "episodes/" at
          # all. The old regex then silently matched only the pre-Releases
          # episodes and reported a months-old one as newest, failing every
          # Monday and crying wolf. pubDate is the feed's own answer to "when
          # is this episode from" and survives any future change of host.
          try:
              items = ET.fromstring(xml).find("channel").findall("item")
          except Exception as e:
              print(f"::error::feed is not parseable XML: {e}")
              sys.exit(1)

          if not items:
              print("::error::no episodes in the feed at all")
              sys.exit(1)

          dates = []
          for it in items:
              pub = it.findtext("pubDate")
              if pub:
                  dates.append(email.utils.parsedate_to_datetime(pub).date())
          if not dates:
              print("::error::no item in the feed has a pubDate")
              sys.exit(1)

          newest = max(dates)
          if newest < today:
              print(f"::error::newest episode is {newest}, expected {today}")
              sys.exit(1)
          print(f"feed is fresh: newest episode {newest} ({len(items)} items)")
          PY

      - name: Open an issue if the feed is stale
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "No fresh episode in the feed this Monday" \
            --body "The Monday feed watchdog found the newest episode is not dated today.

          Likely causes, in order:
          1. The Sunday producer task never ran or never pushed a script.
          2. The pushed filename has no \`YYYY-MM-DD\` date or missed the \`scripts/\` path filter.
          3. The publish workflow ran and failed (it files its own issue -- check for one).

          Feed: https://jtdancy-jarvis.github.io/monday-brief/feed.xml
          Run log: $RUN_URL" \
            --label bug 2>/dev/null || \
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "No fresh episode in the feed this Monday" \
            --body "The newest episode in the feed is not dated today. Run log: $RUN_URL"
